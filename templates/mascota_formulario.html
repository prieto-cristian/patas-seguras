{% extends 'index.html' %}
{% block mascota_creacion %}
<main class="form-signin w-100 m-auto">
<div>
    <form method="post"> 
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-50 py-2" type="submit">{% block mascota_modificacion %}Crear{% endblock %}</button>
        <a class="btn btn-secondary w-50 py-2" href="{% url 'listar_mascotas' %}">Cancelar</a>
    </form>
</div>
</main>
{% endblock mascota_creacion %}
